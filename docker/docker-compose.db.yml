services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spms
      POSTGRES_PASSWORD: spms
      POSTGRES_DB: spms
    ports:
      - "5432:5432"
    volumes:
      - spms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spms -d spms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  spms_pgdata:
